name: Setup frontend
description: Install Node.js and frontend monorepo npm dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "24.22.x"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: frontend
