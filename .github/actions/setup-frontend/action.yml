name: Setup frontend
description: Install Node.js and frontend monorepo npm dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "24.22.x"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    # Match frontend/package.json devEngines.packageManager (Node 24 ships an older npm).
    - run: npm install -g npm@11.20.0
      shell: bash
    - run: npm ci
      shell: bash
      working-directory: frontend
