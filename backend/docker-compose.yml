services:
  db:
    image: postgres:18.6
    restart: always
    ports: [5432:5432]
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_DB
    volumes:
      - db_volume:/var/lib/postgesql


  adminer:
    image: adminer
    restart: always
    ports: [8080:8080]


volumes:
  db_volume:
